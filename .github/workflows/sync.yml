name: Sync Forks

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all forks
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_REPO_TOKEN }}
        run: |
          forks=$(gh api user/repos --paginate --jq '.[] | select(.fork and .owner.login == "yizhaodev") | .full_name')
          for repo in $forks; do
            info=$(gh api "repos/${repo}" --jq '{upstream: .parent.full_name, branch: .parent.default_branch}')
            upstream=$(echo "$info" | jq -r '.upstream')
            branch=$(echo "$info" | jq -r '.branch')
            if [ "$upstream" = "null" ]; then
              echo "Skipping ${repo}: no parent info"
              continue
            fi
            echo "Syncing: ${upstream} -> ${repo} (branch: ${branch})"
            git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${upstream}.git" tmp-repo
            cd tmp-repo
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"               "refs/heads/${branch}:refs/heads/${branch}"
            cd ..
            rm -rf tmp-repo
            echo "Done: ${upstream} -> ${repo}"
            echo "---"
          done
