name: Sync Forks

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: llm-d-incubation/batch-gateway
            fork: yizhaodev/batch-gateway
            branch: main
          - upstream: llm-d-incubation/llm-d-async
            fork: yizhaodev/llm-d-async
            branch: main
          - upstream: llm-d/llm-d-inference-sim
            fork: yizhaodev/llm-d-inference-sim
            branch: main
          - upstream: opendatahub-io/llm-d-batch-gateway-operator
            fork: yizhaodev/llm-d-batch-gateway-operator
            branch: main
          - upstream: opendatahub-io/opendatahub-operator
            fork: yizhaodev/opendatahub-operator
            branch: main

    steps:
      - name: Sync ${{ matrix.fork }} from ${{ matrix.upstream }}
        run: |
          git clone --bare "https://x-access-token:${{ secrets.SYNC_UPSTREAM_REPO_TOKEN }}@github.com/${{ matrix.upstream }}.git" repo
          cd repo
          git push --force "https://x-access-token:${{ secrets.SYNC_UPSTREAM_REPO_TOKEN }}@github.com/${{ matrix.fork }}.git" "refs/heads/${{ matrix.branch }}:refs/heads/${{ matrix.branch }}"
