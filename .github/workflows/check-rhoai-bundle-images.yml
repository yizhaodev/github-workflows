name: Check RHOAI Bundle Images

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  check-images:
    runs-on: ubuntu-latest
    steps:
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check bundle images
        run: |
          set -euo pipefail

          ENV_NAMES=(
            RELATED_IMAGE_ODH_AI_GATEWAY_OPERATOR_IMAGE
            RELATED_IMAGE_ODH_LLM_D_BATCH_GATEWAY_OPERATOR_IMAGE
            RELATED_IMAGE_ODH_LLM_D_BATCH_GATEWAY_APISERVER_IMAGE
            RELATED_IMAGE_ODH_LLM_D_BATCH_GATEWAY_PROCESSOR_IMAGE
            RELATED_IMAGE_ODH_LLM_D_BATCH_GATEWAY_GC_IMAGE
          )

          BUNDLE_PATCHES=(
            "odh|https://raw.githubusercontent.com/opendatahub-io/ODH-Build-Config/main/bundle/bundle-patch.yaml"
            "rhoai-3.5-ea.2|https://raw.githubusercontent.com/red-hat-data-services/RHOAI-Build-Config/rhoai-3.5-ea.2/bundle/bundle-patch.yaml"
          )

          all_ok=true
          for entry in "${BUNDLE_PATCHES[@]}"; do
            label="${entry%%|*}"
            patch_url="${entry##*|}"
            echo ""
            echo "=== $label ==="
            content=$(curl -sL "$patch_url")
            if [ -z "$content" ]; then
              echo "FAIL: failed to fetch $patch_url"
              all_ok=false
              continue
            fi

            for env_name in "${ENV_NAMES[@]}"; do
              url=$(echo "$content" | yq ".patch.relatedImages[] | select(.name == \"$env_name\") | .value" 2>/dev/null || true)
              if [ -z "$url" ]; then
                echo "FAIL: $env_name not found"
                all_ok=false
                continue
              fi
              if skopeo inspect --override-os linux --override-arch amd64 "docker://$url" >/dev/null 2>&1; then
                echo "PASS: $env_name=$url"
              else
                echo "FAIL: $env_name=$url (image not accessible)"
                all_ok=false
              fi
            done
          done

          echo ""
          if [ "$all_ok" = true ]; then
            echo "All images verified."
          else
            echo "Some images failed verification."
            exit 1
          fi
